
<!DOCTYPE html>
<html>
<head>
    <title>Delete Task</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #dc3545;
        }

        p {
            color: #555;
            margin: 20px 0;
        }

        .task-title {
            font-weight: bold;
            color: #333;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h2>Delete Task?</h2>

        <p>Are you sure you want to delete this task?</p>

        <p class="task-title">{{ task.title }}</p>

        <form method="POST">
            {% csrf_token %}

            <div class="button-group">

                <button type="submit" class="btn btn-danger">
                    Yes, Delete
                </button>

                <a href="{% url 'home' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </div>
        </form>

    </div>
</div>

</body>
</html>
